[package]
name = "local-workbench"
version = "0.1.0"
description = "An offline personal task and time workbench"
authors = ["Local Workbench contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "local_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
cpal = "0.16"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
